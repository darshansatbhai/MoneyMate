services:
  - type: web
    name: moneymate-bot
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free

    region: oregon
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DASHBOARD_URL
        value: https://moneymate-website.vercel.app
